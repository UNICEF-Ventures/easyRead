# Example Docker Compose stack for temporary AWS / EC2 evaluation deployments.
# This file is not intended to be a complete production hardening guide.
# It assumes an Nginx front end serving EasyRead from /easyread/ over HTTPS.

services:
  # PostgreSQL database with pgvector for evaluator deployments
  postgres:
    image: pgvector/pgvector:pg17
    container_name: easyread_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-easyread}
      POSTGRES_USER: ${DB_USER:-easyread_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-easyread_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - easyread_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-easyread_user} -d ${DB_NAME:-easyread}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Kept internal to the Docker network for the evaluation stack

  # Django backend API for the evaluation stack
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: easyread_backend_prod
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-easyread}
      - DB_USER=${DB_USER:-easyread_user}
      - DB_PASSWORD=${DB_PASSWORD:-easyread_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION_NAME=${AWS_REGION_NAME:-us-east-1}
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - ./clipart_images:/app/clipart_images:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - easyread_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Kept internal to the Docker network for the evaluation stack; nginx proxies it

  # Nginx front end for the AWS / EC2 evaluation example
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_MEDIA_BASE_URL: ${VITE_MEDIA_BASE_URL:-}
        VITE_USE_EXTERNAL_PDF_CONVERTER: ${VITE_USE_EXTERNAL_PDF_CONVERTER:-false}
        VITE_PDF_CONVERTER_URL: ${VITE_PDF_CONVERTER_URL:-}
        VITE_PDF_CONVERTER_API_KEY: ${VITE_PDF_CONVERTER_API_KEY:-}
        VITE_PDF_CONVERTER_TOKEN: ${VITE_PDF_CONVERTER_TOKEN:-}
        VITE_PDF_CONVERTER_EMAIL: ${VITE_PDF_CONVERTER_EMAIL:-}
        VITE_API_STAGE: ${VITE_API_STAGE:-}
        VITE_PROJECT_KEY: ${VITE_PROJECT_KEY:-}
        # Default to serving the app from /easyread/ in this evaluation example
        VITE_BASE_URL: ${VITE_BASE_URL:-/easyread/}
        VITE_BASE_URL_PROD: ${VITE_BASE_URL_PROD:-/easyread/}
    container_name: easyread_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media_files:/app/media:ro
      - static_files:/app/staticfiles:ro
      # Required by this example: mounted TLS cert/key and tester Basic Auth file
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - easyread_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching (optional in this evaluation example)
  redis:
    image: redis:7-alpine
    container_name: easyread_redis_prod
    volumes:
      - redis_data:/data
    networks:
      - easyread_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  redis_data:
    driver: local

networks:
  easyread_network:
    driver: bridge