# Docker Compose configuration for VPS deployment
# This file is used by the auto-deployment webhook
#
# Usage: docker-compose -f docker-compose.vps.yml up -d --build
#
# Note: Requires .env file with credentials

services:
  # PostgreSQL Database with pgvector
  postgres:
    image: pgvector/pgvector:pg17
    container_name: easyread_postgres_vps
    environment:
      POSTGRES_DB: easyread
      POSTGRES_USER: easyread_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easyread_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data_vps:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - easyread_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyread_user -d easyread"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Django Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: easyread-backend:latest
    container_name: easyread_backend_vps
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=easyread
      - DB_USER=easyread_user
      - DB_PASSWORD=${POSTGRES_PASSWORD:-easyread_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-easyread.ooi.ventures,localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://easyread.ooi.ventures}
      # AWS Credentials
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION_NAME=${AWS_REGION_NAME:-us-east-1}
      # Email (Resend)
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-OOI - EasyRead <onboarding@resend.dev>}
      # Authentication (OAuth/OTP)
      - VITE_AUTH_METHOD=${VITE_AUTH_METHOD:-oauth}
      - VITE_OIDC_DOMAIN=${VITE_OIDC_DOMAIN}
      - VITE_OIDC_AUTH_DOMAIN=${VITE_OIDC_AUTH_DOMAIN}
      - VITE_OIDC_CLIENT_ID=${VITE_OIDC_CLIENT_ID}
      - VITE_OAUTH_NAMESPACE=${VITE_OAUTH_NAMESPACE}
      - VITE_PROJECT_KEY=${VITE_PROJECT_KEY:-easyread}
      - AUTH0_CHECK_PROJECT_ACCESS=${AUTH0_CHECK_PROJECT_ACCESS:-false}
      # Performance
      - MAX_CONCURRENT_SIMILARITY_SEARCHES=8
      - BATCH_CHUNK_SIZE=100
      - EMBEDDING_CACHE_TIMEOUT=7200
    volumes:
      # Persistent data only, no source code mounts
      - media_data_vps:/app/media
      - static_data_vps:/app/staticfiles
      # Read-only mounts for images if they exist
      - ./images:/app/images:ro
      - ./clipart_images:/app/clipart_images:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - easyread_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # React Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Use relative /api path for nginx proxy
        - VITE_API_BASE_URL=/api
        - VITE_MEDIA_BASE_URL=
        - VITE_AUTH_METHOD=${VITE_AUTH_METHOD:-oauth}
        - VITE_OIDC_DOMAIN=${VITE_OIDC_DOMAIN}
        - VITE_OIDC_AUTH_DOMAIN=${VITE_OIDC_AUTH_DOMAIN}
        - VITE_OIDC_CLIENT_ID=${VITE_OIDC_CLIENT_ID}
        - VITE_OAUTH_NAMESPACE=${VITE_OAUTH_NAMESPACE}
        - VITE_PROJECT_KEY=${VITE_PROJECT_KEY:-easyread}
    image: easyread-frontend:latest
    container_name: easyread_frontend_vps
    ports:
      - "8083:80"
    volumes:
      # Mount media and static files for serving
      - media_data_vps:/usr/share/nginx/media:ro
      - static_data_vps:/usr/share/nginx/static:ro
      # Mount custom nginx configuration
      - ./nginx.vps.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - easyread_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data_vps:
    driver: local
  media_data_vps:
    driver: local
  static_data_vps:
    driver: local

networks:
  easyread_network:
    # Use existing network created by first deployment
    external: true
    name: easyread_easyread_network
