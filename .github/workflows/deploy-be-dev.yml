name: Deploy Django to EC2

on:
  push:
    branches: [ playground_dev ]
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key (.pem)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_PEM }}" > ~/.ssh/ec2-key.pem
          chmod 400 ~/.ssh/ec2-key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync project folder to EC2 (rsync)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ec2-key.pem" \
            --exclude 'venv/' \
            --exclude '*.pyc' \
            --exclude '__pycache__/' \
            --exclude '.env' \
            ./backend/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}"

      - name: Create .env file on EC2
        run: |
          ssh -i ~/.ssh/ec2-key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'ENDSSH'
            cd "${{ secrets.EC2_APP_DIR }}"
            
            cat > .env << 'EOF'
          # Django Configuration
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          
          # Database Configuration
          DB_ENGINE=postgresql
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}

          # Storage Configuration
          MEDIA_STORE=${{ secrets.MEDIA_STORE }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          S3_BUCKET_REGION=${{ secrets.S3_BUCKET_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}

          # Environment
          IS_PROD=true
          EOF
            
            chmod 600 .env
          ENDSSH

      - name: Install dependencies and run migrations
        run: |
          ssh -i ~/.ssh/ec2-key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'ENDSSH'
            cd "${{ secrets.EC2_APP_DIR }}"
            
            # Create venv if it doesn't exist
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # Activate and install
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Load env vars and run Django commands
            export $(grep -v '^#' .env | xargs)
            python manage.py migrate --noinput
          ENDSSH

      - name: Restart application with Gunicorn
        run: |
          ssh -i ~/.ssh/ec2-key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'ENDSSH'
            cd "${{ secrets.EC2_APP_DIR }}"
            
            # Kill existing Gunicorn processes
            pkill -f gunicorn || true
            sleep 2
            
            # Start Gunicorn with env vars
            source venv/bin/activate
            export $(grep -v '^#' .env | xargs)
            
            nohup gunicorn -k uvicorn.workers.UvicornWorker \
            --workers 3 \
            --bind 0.0.0.0:8000 \
            --timeout 120 \
            --access-logfile - \
            --error-logfile - \
            easyread_backend.asgi:application > gunicorn.log 2>&1 &

           
            echo "Application restarted successfully!"
          ENDSSH