name: Deploy Django to EC2

on:
  push:
    branches: [ playground_dev ]  # or your deploy branch
    workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key (.pem)
        run: |
          mkdir -p ~/.ssh
          # Write the PEM secret to a file
          echo "${{ secrets.EC2_SSH_KEY_PEM }}" > ~/.ssh/ec2-key.pem
          chmod 400 ~/.ssh/ec2-key.pem

          # Add EC2 host to known_hosts so SSH doesn't prompt
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync project folder to EC2 (rsync)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ec2-key.pem" \
            ./backend/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}"

      - name: Install dependencies
        run: |
          ssh -i ~/.ssh/ec2-key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
          
            cd "${EC2_APP_DIR:-/var/www/django-app}"
            cat "${EC2_APP_DIR:-/var/www/django-app}"
            
            # Create / update venv
            python3 -m venv venv
            source venv/bin/activate

            # Install dependencies
            pip install -r requirements.txt
          EOF
      - name: Run deploy commands on EC2
        run: |
          ssh -i ~/.ssh/ec2-key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            # Django housekeeping
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # Restart gunicorn (service you created on EC2)
            # Source - https://stackoverflow.com/a
            # Posted by TheResolver
            # Retrieved 2025-11-27, License - CC BY-SA 4.0

            nohup python manage.py runserver 0.0.0.0:8000 &

          EOF
