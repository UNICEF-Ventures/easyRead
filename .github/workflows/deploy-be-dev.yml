name: Deploy Django to EC2

on:
  push:
    branches: [ playground_dev ]  # or your deploy branch
    workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key (.pem)
        run: |
          mkdir -p ~/.ssh
          # Write the PEM secret to a file
          echo "${{ secrets.EC2_SSH_KEY_PEM }}" > ~/.ssh/ec2-key.pem
          chmod 400 ~/.ssh/ec2-key.pem

          # Add EC2 host to known_hosts so SSH doesn't prompt
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync project folder to EC2 (rsync)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ec2-key.pem" \
            ./backend/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}"

      - name: Install dependencies
        run: |
          ssh -i ~/.ssh/ec2-key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
          "export APP_DIR='${{ secrets.EC2_APP_DIR }}' && \
          cat $APP_DIR

          cd \$APP_DIR
          echo "Writing .env file..."
          cat > .env << EENV
          # Django Security Configuration
          ALLOWED_HOSTS="${{ secrets.ALLOWED_HOSTS }}"
          
          # Database Configuration - PostgreSQL with pgvector
          DB_ENGINE=postgresql
          DB_NAME="${{ secrets.DB_NAME }}"
          DB_USER="${{ secrets.DB_USER }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          DB_HOST="${{ secrets.DB_HOST }}"
          DB_PORT="${{ secrets.DB_PORT }}"
         
          # MEDIA_STORE=server

          MEDIA_STORE="${{ secrets.MEDIA_STORE }}"
          S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}"
          S3_BUCKET_REGION="${{ secrets.S3_BUCKET_REGION }}"

          IS_PROD=true
          EENV

          echo ".env file updated."
          python3 -m venv venv && \
          source venv/bin/activate && \
          pip install -r requirements.txt && \
          python manage.py migrate --noinput && \
          python manage.py collectstatic --noinput && \
          nohup python manage.py runserver 0.0.0.0:8000 &"