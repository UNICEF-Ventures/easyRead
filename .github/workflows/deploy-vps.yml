name: Deploy to VPS

on:
  push:
    branches:
      - vps-version  # Trigger deployment on push to vps-version branch
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to unicef-tailscale VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H unicef-tailscale >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        run: |
          ssh ec2-user@unicef-tailscale << 'ENDSSH'
            set -e

            echo "🚀 Starting deployment to VPS..."

            # Navigate to deployment directory
            cd ~/easyread

            # Pull latest changes
            echo "📥 Pulling latest code from GitHub..."
            git fetch origin
            git reset --hard origin/vps-version

            # Build and restart services
            echo "🔨 Building and restarting containers..."
            docker-compose -f docker-compose.vps.yml build --no-cache
            docker-compose -f docker-compose.vps.yml up -d

            # Wait for services to be healthy
            echo "⏳ Waiting for services to start..."
            sleep 10

            # Check service status
            echo "✅ Deployment complete! Service status:"
            docker-compose -f docker-compose.vps.yml ps

            echo "🎉 Deployment successful!"
          ENDSSH

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh ec2-user@unicef-tailscale "docker-compose -f ~/easyread/docker-compose.vps.yml ps --format json" || true
